<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">More Episodes  new lessons in progress</title>
  <desc id="desc">AI Knowledge Classroom coming soon card</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5ff"/>
      <stop offset="55%" stop-color="#eef0ff"/>
      <stop offset="100%" stop-color="#fff6eb"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b4bb5"/>
      <stop offset="100%" stop-color="#7b5fd4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="48" y="48" width="320" height="52" rx="26" fill="#fff" stroke="#cdddf0" stroke-width="2"/>
  <text x="72" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#3878b4" letter-spacing=".08em">AI KNOWLEDGE CLASSROOM</text>
  <ellipse cx="960" cy="120" rx="150" ry="44" fill="url(#badge)"/>
  <text x="960" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff">Coming Soon</text>
  <text x="120" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="900" fill="#153d70" stroke="#f5c542" stroke-width="8" paint-order="stroke">More Episodes</text>
  <text x="124" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#4e637e">New lessons in progress</text>
  <rect x="120" y="580" width="420" height="8" rx="4" fill="#d8e6f5"/>
  <rect x="120" y="580" width="260" height="8" rx="4" fill="#1768b2" opacity=".85"/>
  <circle cx="180" cy="700" r="70" fill="#eaf4ff" stroke="#b8d4ef" stroke-width="3"/>
  <circle cx="320" cy="700" r="70" fill="#eaf4ff" stroke="#b8d4ef" stroke-width="3" opacity=".6"/>
  <circle cx="460" cy="700" r="70" fill="#eaf4ff" stroke="#b8d4ef" stroke-width="3" opacity=".35"/>
  <text x="1050" y="840" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1768b2">Kiwi 1AI Study</text>
